[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kamonbench"
version = "0.1.0"
description = "KamonBench benchmark tools and reference baselines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "jaconv>=0.3.4",
  "jsonlines>=4.0.0",
  "numpy>=1.20.0",
  "Pillow>=9.0.0",
  "timm>=1.0.0",
  "torch==2.9.1",
  "torchvision>=0.15.0",
  "tqdm>=4.65.0",
]

[project.scripts]
kamonbench = "kamonbench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kamonbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
